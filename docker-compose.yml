services:
  searxng:
    image: searxng/searxng:2026.9.16-461f174b0
    expose:
      - "8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - ./data/searxng:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://websearch.sparkfn.io/searxng/
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  crawl4ai:
    image: unclecode/crawl4ai:0.9.4
    expose:
      - "11235"
    env_file:
      - ./data/crawl4ai/.llm.env
    environment:
      # crawl4ai >=0.9 binds gunicorn to 127.0.0.1 by default; the api
      # container must reach it over the internal network.
      - GUNICORN_BIND=0.0.0.0:11235
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN in .env}
    shm_size: "2gb"
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      # 0.9.x auth-gates every endpoint incl. /monitor/health: send the token.
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; q=urllib.request.Request('http://localhost:11235/monitor/health', headers={'Authorization': 'Bearer '+os.environ['CRAWL4AI_API_TOKEN']}); urllib.request.urlopen(q)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  reranker:
    # Off-the-shelf cross-encoder server (TEI). `cpu-<ver>` is the amd64 tag; arm64
    # hosts must set RERANKER_IMAGE to the `cpu-arm64-<ver>` tag.
    image: ${RERANKER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4}
    command:
      - --model-id
      - ${RERANKER_MODEL_ID:-mixedbread-ai/mxbai-rerank-xsmall-v1}
      - --revision
      - ${RERANKER_MODEL_REVISION:-b5c6e9da73abc3711f593f705371cdbe9e0fe422}
      - --port
      - "7997"
      # The api batches at RERANK_BATCH (default 32) documents per request; keep in step.
      - --max-client-batch-size
      - "32"
    expose:
      - "7997"
    volumes:
      - ./data/reranker:/data
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7997/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot downloads the model into ./data/reranker before /health passes:
      # 91s measured cold (279MB of weights), 300s leaves room for a slow link.
      start_period: 300s

  api:
    build: ./api
    container_name: websearch-sparkfn-api
    expose:
      - "8000"
    environment:
      - SEARXNG_URL=http://searxng:8080
      - CRAWL4AI_URL=http://crawl4ai:11235
      - RERANKER_URL=http://reranker:7997
      - SEARCH_CANDIDATES=${SEARCH_CANDIDATES:-10}
      - MAX_RESULTS=${MAX_RESULTS:-5}
      - CHUNK_SIZE=${CHUNK_SIZE:-1800}
      - MAX_PAGE_CHARS=${MAX_PAGE_CHARS:-60000}
      - CRAWL_CONCURRENCY=${CRAWL_CONCURRENCY:-3}
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN in .env}
      - WEBSEARCH_API_KEY=${WEBSEARCH_API_KEY:?set WEBSEARCH_API_KEY in .env}
      - BRAVE_API_KEYS=${BRAVE_API_KEYS:-}
    depends_on:
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
      reranker:
        # Only "started": a reranker still downloading its model must not hold the API
        # back, since search falls back to lexical order until it is up.
        condition: service_started
    restart: unless-stopped
    networks:
      - internal
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  internal:
  traefik:
    external: true
