use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "${SEARXNG_SECRET}"
  limiter: false
  public_instance: false

search:
  formats:
    - html
    - json

outgoing:
  # Cap per-engine stalls: one dead engine must not stall discovery.
  request_timeout: 8.0
  max_request_timeout: 15.0

# NOTE: with use_default_settings: true this section MERGES by engine name —
# unlisted default engines stay enabled. Discovery is fenced per-request via
# the `engines` query param in api/app.py instead of enumerating all defaults
# here. This list only tunes the engines we actually use.
#
# This set must stay in sync with SEARXNG_ENGINES in api/app.py.
# All four verified enabled in /config and returning results on 2026-10-02.
# mojeek and marginalia are deliberately absent: the image marks them
# `inactive: true` (mojeek needs a Proof-of-Work CAPTCHA, marginalia needs an
# API key), and `inactive` is NOT overridable here — unlike `disabled`, it
# keeps the engine out of /config entirely, so naming it silently shrinks the
# engine set rather than failing. Check /config before adding an engine.
engines:
  - name: bing
    disabled: false
    timeout: 8.0
  - name: brave
    disabled: false
    timeout: 8.0
  - name: duckduckgo
    disabled: false
    timeout: 8.0
  - name: google cse
    disabled: false
    timeout: 8.0
